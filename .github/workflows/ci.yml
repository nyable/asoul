name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Display Go version
        run: go version

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        run: go build -o /tmp/asoul ./cmd/asoul

  windows-editor:
    name: Windows editor and file access
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: Test native editor launch, quoting and ACLs
        run: go test -v ./internal/editor ./internal/agent
      - name: Verify Windows atomic writes preserve ACLs
        run: go test -v ./internal/fsx -run TestAtomicWritePreservesWindowsDACL
      - name: Build Windows CLI
        run: go build -o "$env:RUNNER_TEMP/asoul.exe" ./cmd/asoul
